<ion-item-sliding>
  <ion-item>
    <ion-checkbox
      labelPlacement="end"
      justify="start"
      [checked]="task().completed"
      (ionChange)="toggleCompleted.emit()"
    >
      <span class="title" [class.completed]="task().completed">{{ task().title }}</span>
    </ion-checkbox>

    @if (showCategory()) {
      @let current = category();
      <button
        type="button"
        slot="end"
        class="category-chip"
        [class.empty]="!current"
        [style.--chip-color]="current?.color"
        [attr.aria-label]="current ? 'Categoría ' + current.name + '. Cambiar categoría' : 'Asignar categoría'"
        (click)="changeCategory.emit()"
      >
        @if (current) {
          <span class="dot" aria-hidden="true"></span>
          <span class="name">{{ current.name }}</span>
        } @else {
          <ion-icon name="pricetag-outline" aria-hidden="true"></ion-icon>
        }
      </button>
    }

    <ion-button slot="end" fill="clear" color="medium" aria-label="Eliminar tarea" (click)="deleteTask.emit()">
      <ion-icon slot="icon-only" name="trash-outline" aria-hidden="true"></ion-icon>
    </ion-button>
  </ion-item>

  <ion-item-options side="end" (ionSwipe)="deleteTask.emit()">
    <ion-item-option color="danger" expandable (click)="deleteTask.emit()">Eliminar</ion-item-option>
  </ion-item-options>
</ion-item-sliding>
